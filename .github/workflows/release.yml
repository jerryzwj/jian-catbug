name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已配置），无需再装
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Read version
        id: ver
        run: |
          V=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build release
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "catbug-v${{ steps.ver.outputs.version }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: catbug-apk
          path: catbug-v*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: v${{ steps.ver.outputs.version }}
          files: catbug-v*.apk
          body: |
            简·猫抓虫 v${{ steps.ver.outputs.version }}
            下载下方 catbug-v*.apk 直接覆盖安装即可。
