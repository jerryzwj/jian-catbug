plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jerryzwj.catbug'
    compileSdk 34

    defaultConfig {
        applicationId "com.jerryzwj.catbug"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
        resourceConfigurations += ['zh']
    }

    signingConfigs {
        release {
            storeFile file("../keystore/catbug.jks")
            storePassword "catbug2026"
            keyAlias "catbug"
            keyPassword "catbug2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
}
